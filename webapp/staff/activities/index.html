<!DOCTYPE html>
<html lang='en' data-theme="light">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="/icons/hollyrosa.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activities | Anna Bookning</title>

    <link rel="stylesheet" href="/css/main.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>

    <script src="/js/scripts.js"></script>
    <script src="/js/modal.js"></script>
    <script type="module" src="/js/api/index.js"></script>

</head>

<style>
    .modal-background {
        background-color: rgba(0, 0, 0, 0.4);
    }
</style>

<body class="has-navbar-fixed-top">
    <nav id="common-staff-navbar" class="navbar is-fixed-top is-primary" role="navigation" aria-label="main navigation">
    </nav>

    <div class="container">
        <section class="section is-fullheight">

            <nav class="breadcrumb" aria-label="breadcrumbs">
                <ul>
                    <li class="is-active"><a href="/staff/activities" aria-current="page">Activities</a></li>
                </ul>
            </nav>

            <div class="block">
                <div class="container" id="notification-container"></div>
                <h1 id="pagetitle" class="title">View all activities</h1>
            </div>

            <div class="columns">

                <div class="column is-narrow">
                    <aside class="menu">
                        <ul class="menu-list">
                            <li>
                                <label class="button js-modal-trigger" data-target="activityModal">
                                    <span class="iconify" data-icon="mdi-add"></span>&nbsp; New activity
                                </label>
                            </li>
                        </ul>
                        <p class="menu-label">Search</p>
                        <ul class="menu-list">
                            <li>
                                <div class="field">
                                    <div class="control has-icons-left">
                                        <input class="input" type="text" placeholder="Search...">
                                        <span class="icon is-left">
                                            <span class="iconify" data-icon="mdi-search"></span>
                                        </span>
                                    </div>
                                </div>
                            </li>
                        </ul>
                        <p class="menu-label">Filters</p>
                        <ul class="menu-list">
                            <li>
                                <a">Categories</a>
                                    <ul>
                                        <li><label><input type="checkbox" checked> Todo...</label></li>
                                    </ul>
                            </li>
                            <li>
                                <a">Tags</a>
                                    <ul>
                                        <li><label><input type="checkbox" checked> Todo...</label></li>
                                        <li><label><input type="checkbox" checked> Program</label></li>
                                        <li><label><input type="checkbox" checked> Fladan</label></li>
                                        <li><label><input type="checkbox" checked> Distriktsläger</label></li>
                                    </ul>
                            </li>
                        </ul>

                        <p class="menu-label">Navigation</p>
                        <ul class="menu-list">
                            <li><a href="./index.html">Activities list</a></li>
                            <li><a href="./categories.html">Categories</a></li>
                            <li><a href="./tags.html">Tags</a></li>
                        </ul>

                    </aside>

                </div>

                <div class="column">

                    <div class="table-container">
                        <table id="activitiesTable" class="table is-striped is-hoverable is-fullwidth">
                            <thead>
                                <tr>
                                    <th class="is-narrow"></th>
                                    <th>Title</th>
                                    <th>Subtitle</th>
                                    <th class="is-narrow">Tag</th>
                                </tr>
                            </thead>
                            <!-- <tfoot>
                                <tr>
                                    <td colspan="3"></td>
                                </tr>
                            </tfoot> -->
                        </table>
                    </div>
                </div>
            </div>



        </section>

    </div>

    <footer class="footer" id="common-footer"></footer>

    <div class="modal" id="activityModal">
        <div class="modal-background"></div>

        <div class="modal-card">
            <header class="modal-card-head">
                <p class="modal-card-title" id="modalTitle">New category</p>
                <button class="delete close-modal"></button>
            </header>

            <section class="modal-card-body">
                <form id="form-create-activity">
                    <input type="hidden" id="activityId">

                    <!-- Title -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Title*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p class="control">
                                    <input class="input" type="text" name="title" id="activityTitle" placeholder="Name">
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Category -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Category*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="select">
                                    <select id="categorySelect"></select>
                                </div>
                                <p class="help">Used to sort activities.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Tag -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Tag</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="select">
                                    <select id="tagSelect"></select>
                                </div>
                                <p class="help">Used to create schedule views.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Tag -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label"></label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p>More fields will be available in the activity view page.</p>
                            </div>
                        </div>
                    </div>

                </form>
            </section>

            <footer class="modal-card-foot">
                <div class="buttons">
                    <button class="button is-primary" onclick="saveActivity()" id="saveCategory">
                        Save
                    </button>
                    <button class="button close-modal">
                        Cancel
                    </button>
                </div>
            </footer>
        </div>
    </div>

</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        initHTML();
        init();
    });

    const activitiesTable = document.getElementById("activitiesTable");
    const activityModal = document.getElementById("activityModal")

    async function init() {
        try {
            const categories = await api.getActivitiesByCategory();
            const tags = await api.getTags();

            const categorySelect = document.getElementById("categorySelect");
            const tagSelect = document.getElementById("tagSelect");

            categories.forEach(category => {
                renderCategoryHead(category);
                renderActivities(category);
                categorySelect.innerHTML += `<option value="${category.category_id}">${category.name}</option>`;
            });

            tagSelect.innerHTML = `<option value=null>none</option>`;
            tags.forEach(tag => {
                tagSelect.innerHTML += `<option value="${tag.tag_id}">${tag.name}</option>`;
            })
        } catch (err) {
            showWarning("Could not get activities!", err.message)
            console.log(err)
        }
    }

    function renderCategoryHead(category) {
        const categoryHead = document.createElement("thead");
        categoryHead.id = `row-${category.category_id}`;
        categoryHead.style.backgroundColor = category.color;
        categoryHead.innerHTML = `
            <tr>
                <td style="vertical-align: middle" id="chevron-${category.category_id}">
                    <span class="iconify" data-icon="mdi-chevron-down" style="font-size: 32px;">></span>
                </td>
                <th colspan="3">
                    <div class="tag is-large is-white">
                        ${category.name}
                    </div>
                </th>
            </tr>
        `;
        categoryHead.addEventListener("click", (e) => {
            const categoryBody = document.getElementById(`body-${category.category_id}`);
            const categoryChevron = document.getElementById(`chevron-${category.category_id}`);

            if (categoryBody.style.display === "") {
                categoryBody.style.display = "none";
                categoryChevron.innerHTML = `<span class="iconify" data-icon="mdi-chevron-right" style="font-size: 32px;">></span>`;
            } else {
                categoryBody.style.display = "";
                categoryChevron.innerHTML = `<span class="iconify" data-icon="mdi-chevron-down" style="font-size: 32px;">></span>`;
            }
        });
        categoryHead.style.cursor = "pointer";
        activitiesTable.appendChild(categoryHead);
    }

    function renderActivities(category) {
        const categoryBody = document.createElement("tbody");
        categoryBody.id = `body-${category.category_id}`;
        if (category.activities.length > 0) {
            category.activities.forEach(activity => {
                const activityRow = document.createElement("tr");
                activityRow.innerHTML = renderActivity(activity);
                activityRow.addEventListener("click", (e) => {
                    window.location = `./view.html?activity_id=${activity.activity_id}`;
                });
                activityRow.style.cursor = "pointer";
                categoryBody.appendChild(activityRow);
            })
        } else {
            categoryBody.innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center;">
                        <i>No activities...</i>
                    </td>
                </tr>
            `;
        }
        activitiesTable.appendChild(categoryBody);
    }

    function renderActivity(activity) {
        return `
            <tr>
                <td></td>
                <td>${activity.title}</td>
                <td>${activity.subtitle || ""}</td>
                <td>${activity.tag ? makeTag(activity.tag.name) : ""}</td>
            </tr>
        `;
    }

    async function saveActivity() {

        const activity = {
            title: document.getElementById("activityTitle").value,
            category_id: categorySelect.value,
            tag_id: tagSelect.value
        };
        console.log(activity)
        await api.createActivity(activity);


        closeModal(document.getElementById("activityModal"));
        await init();
    }

</script>
