<!DOCTYPE html>
<html lang='en' data-theme="light">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="/icons/hollyrosa.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Groups | Anna Bookning</title>

    <link rel="stylesheet" href="/css/main.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>

    <script src="/js/scripts.js"></script>
    <script src="/js/modal.js"></script>
    <script type="module" src="/js/api/index.js"></script>


    <script src="/vendor/BulmaDatePicker.js"></script>
    <link rel="stylesheet" href="/vendor/BulmaDatePicker.css">


</head>

<style>
    .modal-background {
        background-color: rgba(0, 0, 0, 0.4);
    }
</style>

<body class="has-navbar-fixed-top">
    <nav id="common-staff-navbar" class="navbar is-fixed-top is-primary" role="navigation" aria-label="main navigation">
    </nav>

    <div class="container">
        <section class="section is-fullheight">

            <nav class="breadcrumb" aria-label="breadcrumbs">
                <ul>
                    <li class="is-active"><a href="/staff/groups" aria-current="page">Groups</a></li>
                </ul>
            </nav>

            <div class="block">
                <div class="container" id="notification-container"></div>
                <h1 id="pagetitle" class="title">View all groups</h1>
                <button class="button js-modal-trigger" data-target="modal-create-group">
                    <span class="iconify" data-icon="mdi-plus"></span>&nbsp;Create new group
                </button>
            </div>


            <div class="table-container">
                <table class="table is-striped is-hoverable is-fullwidth">
                    <thead>
                        <tr>
                            <th class="is-narrow"><abbr title="Booking number"><span class="iconify" data-icon="mdi-pound"></span></abbr>
                            </th>
                            <th>Name</th>
                            <th class="is-narrow"><abbr title="Kids + leaders">Participants</abbr></th>
                            <th class="is-narrow"><abbr title="On island today"><span class="iconify"
                                        data-icon="mdi-island"></span></abbr></th>
                            <th>Arrival</th>
                            <th>Departure</th>
                            <th class="is-narrow">Type</th>
                            <th class="is-narrow">Accomodation</th>
                        </tr>
                    </thead>
                    <tbody id="groupsTable"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="9"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

    </div>

    <footer class="footer" id="common-footer"></footer>

    <!-- Create new group modal -->
    <div id="modal-create-group" class="modal">
        <div class="modal-background"></div>

        <div class="modal-content">
            <form id="form-create-group">
                <div class="box" style="border: 1px solid black">
                    <h3 class="subtitle">
                        <span class="iconify" data-icon="mdi-plus"></span>&nbsp;Create new group
                    </h3>

                    <!-- Group name -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Group name*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="control has-icons-left">
                                    <input class="input" type="text" name="name" placeholder="Group name" required>
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-tent"></span>
                                    </span>
                                </div>
                                <p class="help">Helpful description of group. For example "X Scoutkår MSC1"...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Booking number -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Booking number*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="control has-icons-left">
                                    <input class="input" type="number" name="booking_number" placeholder="NNNN"
                                        required>
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-numeric"></span>
                                    </span>
                                </div>
                                <p class="help">Provided by Storgårn.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Camp time = Arrival and departure dates -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Camp time*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div id="dateControl"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Contact -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Contact info</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="control has-icons-left">
                                    <input class="input" type="text" name="contact_name" placeholder="Name">
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-account"></span>
                                    </span>
                                </div>
                            </div>
                            <div class="field">
                                <div class="field has-addons">
                                    <p class="control is-expanded has-icons-left">
                                        <input class="input" type="tel" name="contact_phone"
                                            placeholder="Phone number (+46...)">
                                        <span class="icon is-small is-left">
                                            <span class="iconify" data-icon="mdi-phone"></span>
                                        </span>
                                    </p>
                                </div>
                            </div>
                            <div class="field">
                                <p class="control is-expanded has-icons-left">
                                    <input class="input" type="email" name="contact_email" placeholder="Email">
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-email"></span>
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Accomodation -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Accomodation</label>
                        </div>
                        <div class="field-body">
                            <div class="field has-addons">
                                <div class="radios">
                                    <div class="control">
                                        <label class="radio">
                                            <input type="radio" name="accomodation" checked value="in" />
                                            In
                                        </label>
                                        <label class="radio">
                                            <input type="radio" name="accomodation" value="out" />
                                            Out
                                        </label>
                                        <label class="radio">
                                            <input type="radio" name="accomodation" value="day" />
                                            Day
                                        </label>
                                        <label class="radio">
                                            <input type="radio" name="accomodation" value="other" />
                                            Other
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Type -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Type</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="field has-addons">
                                    <div class="radios">
                                        <div class="control">
                                            <label class="radio">
                                                <input type="radio" name="type" checked value="own" />
                                                Own
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="type" value="external" />
                                                External
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="type" value="staff" />
                                                Staff
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="type" value="test" />
                                                Test
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Subgroups -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Subgroups</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="field has-addons">
                                    <div class="radios">
                                        <div class="control">
                                            <label class="radio">
                                                <input type="radio" name="subgroups" checked value="default" />
                                                One subgroup
                                            </label>
                                            <p class="help">En deltagargrupp "Deltagare".</p>
                                            <label class="radio">
                                                <input type="radio" name="subgroups" value="scoutgroup" />
                                                Scout troops
                                            </label>
                                            <p class="help">Avdelningar efter åldersgrupp. Bävrar, spårare osv.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <!-- Left empty for spacing -->
                        </div>
                        <div class="field-body">
                            <div class="field is-horizontal  is-grouped is-grouped-right">
                                <p class="control">
                                    <button type="submit" class="button is-primary">
                                        <span class="iconify" data-icon="mdi-content-save"></span>&nbsp;
                                        Create new group
                                    </button>
                                </p>
                                <p class="control">
                                    <button type="button" class="button is-danger modal-cancel">
                                        <span class="iconify" data-icon="mdi-times"></span>&nbsp;
                                        Cancel
                                    </button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <button class="modal-close is-large" aria-label="close"></button>
    </div>


</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        initHTML();
        init();
    });


    let users;
    groupsTable = document.getElementById("groupsTable");

    const dateControl = new BulmaDatePicker(document.getElementById('dateControl'), { range: true });

    async function init() {
        try {
            groups = await api.getAllGroups();


            groups.forEach(group => {
                const row = document.createElement('tr');
                row.id = `${group.group_id}`;
                row.style.cursor = "pointer";
                row.innerHTML = `
                <td>${group.booking_number}</td>
                <th>${group.name}</th>
                <td>${renderParticipants(group.participants, group.leaders)}</td>
                <td>${makeCheck(group.on_island)}</td>
                <td>${group.arrival_date}</td>
                <td>${group.departure_date}</td>
                <td>${makeTag(group.type)}</td>
                <td>${makeTag(group.accomodation)}</td>
            `;
                row.addEventListener("click", (e) => {
                    window.location = `./view.html?group_id=${row.id}`;
                });
                groupsTable.appendChild(row);
            });
        } catch (err) {
            showWarning("Could not get groups!", err)
        }


    }

    // Create user form submit handler
    const form = document.getElementById("form-create-group");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const data = new FormData(form);
        const [arrival_date, departure_date] = dateControl.getValue();

        const group = {
            name: data.get("name"),
            booking_number: data.get("booking_number"),
            arrival_date: arrival_date,
            departure_date: departure_date,
            accomodation: data.get("accomodation"),
            type: data.get("type"),
            contact_name: data.get("contact_name"),
            contact_phone: data.get("contact_phone"),
            contact_email: data.get("contact_email"),
            subgroups: data.get("subgroups")
        };

        try {
            await api.createGroup(group);
            showSuccess("Group created!")
            form.reset();
            const modal = form.closest(".modal");
            modal.classList.remove("is-active");
        } catch (err) {
            showWarning("Could not create group!", err)
        }
    });

</script>
