<!DOCTYPE html>
<html lang='en' data-theme="light">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="/icons/hollyrosa.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>View user | Anna Bookning</title>

    <link rel="stylesheet" href="/css/main.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>

    <script src="/js/scripts.js"></script>
    <script type="module" src="/js/api/index.js"></script>


</head>

<body class="has-navbar-fixed-top">
    <nav id="common-staff-navbar" class="navbar is-fixed-top is-primary" role="navigation" aria-label="main navigation">
    </nav>

    <div class="container">
        <section class="section is-fullheight">

            <nav class="breadcrumb" aria-label="breadcrumbs">
                <ul>
                    <li class=""><a href="/users/" aria-current="page">Users</a></li>
                    <li class="is-active"><a href="/users/view.html" aria-current="page">View user</a></li>
                </ul>
            </nav>

            <div class="block">
                <div class="container" id="notification-container"></div>
                <h1 id="pagetitle" class="title">View user</h1>
                <!-- <h3 class="subtitle"></h3> -->
                <div class="buttons">
                    <button class="button">
                        <span class="iconify" data-icon="mdi-pencil"></span>&nbsp;Edit user
                    </button>
                    <button class="button">
                        <span class="iconify" data-icon="mdi-lock"></span>&nbsp;Change password
                    </button>
                    <button type="submit" class="button is-primary">
                        <span class="iconify" data-icon="mdi-content-save"></span>&nbsp;Save changes
                    </button>
                    <button type="button" class="button is-danger modal-cancel">
                        <span class="iconify" data-icon="mdi-times"></span>&nbsp;Cancel
                    </button>
                </div>
            </div>

            <form id="form-user">
                <div class="columns is-desktop">
                    <div class="column">
                        <div class="box">
                            <!-- <h3 class="subtitle">
                                <span class="iconify" data-icon="mdi-account-plus"></span>&nbsp;Create new user
                            </h3> -->

                            <!-- Username -->
                            <div class="field is-horizontal">
                                <div class="field-label">
                                    <label class="label">Username</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <div class="control">
                                            <input class="input is-static" type="text" name="username"
                                                placeholder="Username" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Displayname -->
                            <div class="field is-horizontal">
                                <div class="field-label">
                                    <label class="label">Displayname</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <div class="control">
                                            <input class="input is-static" type="text" name="displayname"
                                                placeholder="Displayname">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Contact -->
                            <div class="field is-horizontal">
                                <div class="field-label">
                                    <label class="label">Contact info</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <div class="field has-addons">
                                            <p class="control is-expanded has-icons-left">
                                                <input class="input is-static" type="tel" name="phone"
                                                    placeholder="Phone number (+46...)">
                                                <span class="icon is-small is-left">
                                                    <span class="iconify" data-icon="mdi-phone"></span>
                                                </span>
                                            </p>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <p class="control is-expanded has-icons-left">
                                            <input class="input is-static" type="email" name="email"
                                                placeholder="Email">
                                            <span class="icon is-small is-left">
                                                <span class="iconify" data-icon="mdi-email"></span>
                                            </span>
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <!-- Activate -->
                            <div class="field is-horizontal">
                                <div class="field-label">
                                    <label class="label">Active</label>
                                </div>
                                <div class="field-body">
                                    <div class="field has-addons">
                                        <div class="radios">
                                            <div class="control">
                                                <label class="radio">
                                                    <input type="radio" name="active" value="true" disabled />
                                                    Yes
                                                </label>
                                                <label class="radio">
                                                    <input type="radio" name="active" value="false" disabled />
                                                    No
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="column">
                        <div class="box">
                            <!-- Role and permission -->
                            <div class="field is-horizontal">
                                <div class="field-label">
                                    <label class="label">Role</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <div class="field has-addons">
                                            <div class="radios">
                                                <div class="control">
                                                    <label class="radio">
                                                        <input type="radio" name="role" value="staff" disabled />
                                                        Staff
                                                    </label>
                                                    <label class="radio">
                                                        <input type="radio" name="role" value="guest" disabled />
                                                        Guest
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="field is-horizontal" id="permissionField">
                                <div class="field-label">
                                    <label class="label">Permission</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <div class="field has-addons">
                                            <div class="radios">
                                                <div class="control">
                                                    <label class="radio">
                                                        <input type="radio" name="permission" value="none" disabled />
                                                        none
                                                    </label>
                                                    <label class="radio">
                                                        <input type="radio" name="permission" value="program-viewer"
                                                            disabled />
                                                        program-viewer
                                                    </label>
                                                    <label class="radio">
                                                        <input type="radio" name="permission" value="program-jour"
                                                            disabled />
                                                        program-jour
                                                    </label>
                                                    <label class="radio">
                                                        <input type="radio" name="permission" value="program-booker"
                                                            disabled />
                                                        program-booker
                                                    </label>
                                                    <label class="radio">
                                                        <input type="radio" name="permission" value="program-admin"
                                                            disabled />
                                                        program-admin
                                                    </label>
                                                    <label class="radio">
                                                        <input type="radio" name="permission" value="system-admin"
                                                            disabled />
                                                        system-admin
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="box" style="display: none;">
                            <!-- Password -->
                            <div class="field is-horizontal">
                                <div class="field-label">
                                    <label class="label">Password</label>
                                </div>
                                <div class="field-body">
                                    <div class="field">
                                        <p class="control has-icons-left">
                                            <input class="input is-danger" type="password" name="password"
                                                placeholder="Password" required />
                                            <span class="icon is-small is-left">
                                                <span class="iconify" data-icon="mdi-lock"></span>
                                            </span>
                                        </p>
                                        <p class="help">At least 4 symbols.</p>
                                    </div>
                                    <div class="field">
                                        <p class="control has-icons-left">
                                            <input class="input is-danger" type="password" name="repeatpassword"
                                                placeholder="Repeat password" required />
                                            <span class="icon is-small is-left">
                                                <span class="iconify" data-icon="mdi-lock"></span>
                                            </span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

            <!-- RECENT HISTORY -->
            <div class="box">
                <p class="subtitle is-5">
                    Recent history
                </p>
                <div class="table-container">
                    <table class="table is-narrow is-fullwidth is-striped is-hoverable">
                        <thead>
                            <tr>
                                <th>Table name</th>
                                <th>Record</th>
                                <th>Action</th>
                                <th>Changes</th>
                                <th>Time</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <tr>
                                <td colspan="5"><i>No actions so far...</i></td>
                            </tr>
                        </tbody>
                        <tfoot>
                            <tr>
                                <th colspan="6" style="text-align: right;">
                                    <a title="Complete history" class="button" id="completeHistoryButton"
                                        href="./history.html">
                                        <span class="iconify navbar-icon" data-icon="mdi-history"></span>
                                        &nbsp;
                                        <span>Complete history</span>
                                    </a>
                                </th>
                            </tr>
                        </tfoot>
                    </table>
                </div>

            </div>


        </section>

    </div>
    <footer class="footer" id="common-footer"></footer>

</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        initHTML();
        init();
    });

    let state;
    let user;
    let history;
    let userId;
    userTable = document.getElementById("userTable");
    const pagetitle = document.getElementById("pagetitle");

    const completeHistoryButton = document.getElementById("completeHistoryButton")
    const editButton = document.getElementById("editButton");

    async function init() {

        const urlParam = new URLSearchParams(window.location.search).get("user_id");
        if (urlParam) {
            if (urlParam === "me") {
                user = await api.getMe();
                userId = user.user_id;
            } else {
                userId = urlParam;
                user = await api.getUser(userId);
            }

            history = await api.getRecentHistoryOfUser(userId);
            renderHistoryTable(history);
            completeHistoryButton.href = `./history.html?user_id=${userId}`

            renderUserTable(user);

            if (new URLSearchParams(window.location.search).get("edit")) {
                state = "edit";
                editButton.style.display = "none";
            } else {
                state = "view";
                pagetitle.innerHTML = "View user:&nbsp;" + user.displayname;
                // editButton.href = `./view.html?user_id=${userId}&edit=true`;
            }
        }


    }

    function renderUserTable(user) {
        document.querySelectorAll("[data-field]").forEach(el => {

            const field = el.dataset.field;
            const value = user[field];

            if (value == null) return;

            if (el.type === "checkbox") {
                el.checked = value;
                return;
            }

            else if (field === "createdAt" || field === "last_login") {
                el.value = renderDate(value);
                return;
            }

            else if (field === "role") {
                el.innerHTML = makeTag(user.role, `is-${user.role}`);
                return;
            }

            else if (field === "permission") {
                el.innerHTML = makeTag(user.permission);
                return;
            }

            else {
                el.value = value;
            }

        });
    }

    function renderHistoryTable(history) {
        const historyTable = document.getElementById("historyTable");
        if (history.length > 0) {
            historyTable.innerHTML = "";
            history.forEach(entry => {
                historyTable.innerHTML += `
                <tr>
                    <td>${entry.table_name}</td>
                    <td>${renderRecord(entry)}</td>
                    <td>${entry.action}</td>
                    <td>${entry.changes || ""}</td>
                    <td>${renderDate(entry.createdAt)}</td>
                </tr>
            `;
            })
        }
    }

    function renderRecord(entry) {
        if (entry.table_name === "users") {
            if (entry.action === "login") {
                return "";
            } else {
                return entry.record.username
            };
        } else if (entry.table_name === "groups") {
            return entry.record.name;
        } else if (entry.table_name === "activity") {
            return entry.record.title;
        } else {
            return entry.record_id;
        }
    }

</script>
