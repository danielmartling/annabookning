<!DOCTYPE html>
<html lang='en' data-theme="light">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="/icons/hollyrosa.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users | Anna Bookning</title>

    <link rel="stylesheet" href="/css/main.css">

    <script type="text/javascript" src="https://code.jquery.com/jquery-1.7.1.min.js"></script>
    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>

    <script src="/js/scripts.js"></script>
    <script type="module" src="/js/api/index.js"></script>


</head>

<body class="has-navbar-fixed-top">
    <nav id="common-staff-navbar" class="navbar is-fixed-top is-primary" role="navigation" aria-label="main navigation">
    </nav>


    <section class="section is-fullheight">

        <nav class="breadcrumb" aria-label="breadcrumbs">
            <ul>
                <li class="is-active"><a href="/staff/users" aria-current="page">Users</a></li>
            </ul>
        </nav>

        <div class="block">
            <div class="container" id="notification-container"></div>
            <h1 id="pagetitle" class="title">View all users</h1>
        </div>

        <div class="columns is-mobile is-multiline is-vcentered">
            Knappar
        </div>
        <div class="table-container">
            <table class="table is-narrow is-striped is-hoverable">
                <thead>
                    <tr>
                        <th>id</th>
                        <th>User name</th>
                        <th>Display name</th>
                        <th>Role</th>
                        <th>Permission</th>
                        <th>Last login</th>
                        <th>Created at</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTable"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="8"><i>To be added...</i></td>
                    </tr>
                </tfoot>
            </table>
        </div>

    </section>


    <footer class="footer" id="common-footer"></footer>

</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        initHTML();
        init();
    });

    let users;
    usersTable = document.getElementById("usersTable");

    async function init() {
        users = await api.getAllUsers();

        users.forEach(user => {
            const row = document.createElement('tr');
            row.id = `row-${user.user_id}`;
            // row.style.cursor = "pointer";
            row.innerHTML = `
                <td>${user.user_id}</td>
                <td>${user.username}</td>
                <td>${user.displayname}</td>
                <td>${user.role}</td>
                <td>${user.permission}</td> 
                <td>${user.last_login}</td>
                <td>${user.createdAt}</td>
                <td>
                    <div class="buttons">
                        <button id="scheduleButton" class="button">
                            <span class="iconify" data-icon="mdi-calendar-month"></span>
                        </button>
                        <button id="historyButton" class="button">
                            <span class="iconify" data-icon="mdi-history"></span>
                        </button>
                    </div>
                </td>
            `;
            // row.addEventListener("click", (e) => {
            //     const scheduleButton = e.target.closest("#scheduleButton");
            //     const historyButton = e.target.closest("#historyButton");
            //     if (scheduleButton) {
            //         window.location = `./bookings.html?booking_number=${group.booking_number}`;
            //     } else if (historyButton) {
            //         window.location = `./history.html?booking_number=${group.booking_number}`;
            //     } else {
            //         window.location = `./view.html?booking_number=${group.booking_number}`;
            //     }
            // });
            usersTable.appendChild(row);
        });
        
    }
</script>
