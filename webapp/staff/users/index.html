<!DOCTYPE html>
<html lang='en' data-theme="light">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="/icons/hollyrosa.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users | Anna Bookning</title>

    <link rel="stylesheet" href="/css/main.css">

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>

    <script src="/js/scripts.js"></script>
    <script src="/js/modal.js"></script>
    <script type="module" src="/js/api/index.js"></script>


</head>

<style>
    .modal-background {
        background-color: rgba(0, 0, 0, 0.4);
    }
</style>

<body class="has-navbar-fixed-top">
    <nav id="common-staff-navbar" class="navbar is-fixed-top is-primary" role="navigation" aria-label="main navigation">
    </nav>

    <div class="container">
        <section class="section is-fullheight">

            <nav class="breadcrumb" aria-label="breadcrumbs">
                <ul>
                    <li class="is-active"><a href="/staff/users" aria-current="page">Users</a></li>
                </ul>
            </nav>

            <div class="block">
                <div class="container" id="notification-container"></div>
                <h1 id="pagetitle" class="title">View all users</h1>
                <button class="button js-modal-trigger" data-target="modal-create-user">
                    <span class="iconify" data-icon="mdi-account-plus"></span>&nbsp;Create new user
                </button>
            </div>


            <div class="table-container">
                <table class="table is-striped is-hoverable is-fullwidth">
                    <thead>
                        <tr>
                            <th>User name</th>
                            <th>Display name</th>
                            <th class="is-narrow" style="text-align: center">Active</th>
                            <th class="is-narrow" style="text-align: center">Role</th>
                            <th class="is-narrow">Permission</th>
                            <th>Last login</th>
                            <th>Created at</th>
                            <!-- <th></th> -->
                        </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="9"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

    </div>

    <footer class="footer" id="common-footer"></footer>

    <!-- Create new user modal -->
    <div id="modal-create-user" class="modal">
        <div class="modal-background"></div>

        <div class="modal-content">
            <form id="form-create-user">
                <div class="box" style="border: 1px solid black">
                    <h3 class="subtitle">
                        <span class="iconify" data-icon="mdi-account-plus"></span>&nbsp;Create new user
                    </h3>

                    <!-- Username -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Username*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="control has-icons-left">
                                    <input class="input" type="text" name="username" placeholder="Username" required>
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-account"></span>
                                    </span>
                                </div>
                                <p class="help">Used to log in. 3-50 letters, lower case, no blank spaces.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Displayname -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Displayname*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="control has-icons-left">
                                    <input class="input" type="text" name="displayname" placeholder="Displayname"
                                        required>
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-account"></span>
                                    </span>
                                </div>
                                <p class="help">User friendly name. Preferably full name of user.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Contact -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Contact info</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="field has-addons">
                                    <p class="control is-expanded has-icons-left">
                                        <input class="input" type="tel" name="phone"
                                            placeholder="Phone number (+46...)">
                                        <span class="icon is-small is-left">
                                            <span class="iconify" data-icon="mdi-phone"></span>
                                        </span>
                                    </p>
                                </div>
                            </div>
                            <div class="field">
                                <p class="control is-expanded has-icons-left">
                                    <input class="input" type="email" name="email" placeholder="Email">
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-email"></span>
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <!-- Activate -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Activate</label>
                        </div>
                        <div class="field-body">
                            <div class="field has-addons">
                                <div class="radios">
                                    <div class="control">
                                        <label class="radio">
                                            <input type="radio" name="active" checked value="true" />
                                            Yes
                                        </label>
                                        <label class="radio">
                                            <input type="radio" name="active" value="false" />
                                            No
                                        </label>
                                    </div>
                                    <p class="help">Inactive users can not log in.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Role and permission -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Role</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="field has-addons">
                                    <div class="radios">
                                        <div class="control">
                                            <label class="radio">
                                                <input type="radio" name="role" checked value="staff" />
                                                Staff
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="role" value="guest" />
                                                Guest
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="field is-horizontal" id="permissionField">
                        <div class="field-label">
                            <label class="label">Permission</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <div class="field has-addons">
                                    <div class="radios">
                                        <div class="control">
                                            <label class="radio">
                                                <input type="radio" name="permission" checked value="none" />
                                                none
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="permission" value="program-viewer" />
                                                program-viewer
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="permission" value="program-jour" />
                                                program-jour
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="permission" value="program-booker" />
                                                program-booker
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="permission" value="program-admin" />
                                                program-admin
                                            </label>
                                            <label class="radio">
                                                <input type="radio" name="permission" value="system-admin" />
                                                system-admin
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="field is-horizontal">
                        <div class="field-label">
                            <label class="label">Password*</label>
                        </div>
                        <div class="field-body">
                            <div class="field">
                                <p class="control has-icons-left">
                                    <input class="input" type="password" name="password" placeholder="Password"
                                        required />
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-lock"></span>
                                    </span>
                                </p>
                                <p class="help">At least 4 symbols.</p>
                            </div>
                            <div class="field">
                                <p class="control has-icons-left">
                                    <input class="input" type="password" name="repeatpassword"
                                        placeholder="Repeat password" required />
                                    <span class="icon is-small is-left">
                                        <span class="iconify" data-icon="mdi-lock"></span>
                                    </span>
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <div class="field-label">
                            <!-- Left empty for spacing -->
                        </div>
                        <div class="field-body">
                            <div class="field is-horizontal  is-grouped is-grouped-right">
                                <p class="control">
                                    <button type="submit" class="button is-primary">
                                        <span class="iconify" data-icon="mdi-content-save"></span>&nbsp;
                                        Create new user
                                    </button>
                                </p>
                                <p class="control">
                                    <button type="button" class="button is-danger modal-cancel">
                                        <span class="iconify" data-icon="mdi-times"></span>&nbsp;
                                        Cancel
                                    </button>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </form>

        </div>

        <button class="modal-close is-large" aria-label="close"></button>
    </div>

</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        initHTML();
        init();
    });


    let users;
    usersTable = document.getElementById("usersTable");

    async function init() {
        users = await api.getAllUsers();

        users.forEach(user => {
            const row = document.createElement('tr');
            row.id = `${user.user_id}`;
            row.style.cursor = "pointer";
            row.innerHTML = `
                <td>${user.username}</td>
                <td>${user.displayname}</td>
                <td style="text-align: center">${makeCheck(user.active)}</td>
                <td style="text-align: center">${makeTag(user.role, `is-${user.role}`)}</td>
                <td>${user.permission ? makeTag(user.permission, "is-staff") : makeTag("<i>none</i>")}</td> 
                <td>${user.last_login ? renderDateTime(user.last_login) : "<i>never...</i>"}</td>
                <td>${renderDateTime(user.createdAt)}</td>
                <td style="display: none;">
                    <div class="buttons are-small">
                        <button class="button" id="historyButton">
                            <span class="iconify" data-icon="mdi-history"></span>
                        </button>
                        <button class="button" id="viewButton">
                            <span class="iconify" data-icon="mdi-arrow-right"></span>
                        </button>
                    </div>
                </td>
            `;
            row.addEventListener("click", (e) => {
                window.location = `./view.html?user_id=${row.id}`;
            });
            usersTable.appendChild(row);
        });

    }

    // Create user form submit handler
    const form = document.getElementById("form-create-user");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const data = new FormData(form);
        const permission = data.get("permission");

        const user = {
            username: data.get("username").trim().toLoweCase(),
            displayname: data.get("displayname").trim(),
            phone: data.get("phone"),
            email: data.get("email"),
            active: data.get("active") === "true",
            role: data.get("role"),
            permission: permission === "none" ? null : permission,
            password: data.get("password"),
            repeatpassword: data.get("repeatpassword")
        };

        try {
            await api.createUser(user);
            form.reset();
            const modal = form.closest(".modal");
            modal.classList.remove("is-active");
            showSuccess("User created.");
        } catch (error) {
            console.error(error);
            showWarning(error.message);
        }
    });

    const roleRadios = document.querySelectorAll('input[name="role"]');
    const permissionRadios = document.querySelectorAll('input[name="permission"]');

    function updatePermissions() {
        const isGuest = document.querySelector('input[name="role"]:checked').value === 'guest';

        permissionRadios.forEach(radio => {
            radio.disabled = isGuest;
        });

        if (isGuest) {
            document.querySelector('input[name="permission"][value="none"]').checked = true;
        }
    }

    roleRadios.forEach(radio => {
        radio.addEventListener('change', updatePermissions);
    });

    updatePermissions();



</script>
