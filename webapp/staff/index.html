<!DOCTYPE html>
<html lang='en' data-theme="light">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/x-icon" href="/icons/hollyrosa.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | Anna Bookning</title>

    <link rel="stylesheet" href="/css/main.css">

    <script type="text/javascript" src="https://code.jquery.com/jquery-1.7.1.min.js"></script>
    <script src="//code.iconify.design/1/1.0.6/iconify.min.js"></script>

    <script src="/js/scripts.js"></script>
    <script type="module" src="/js/api/index.js"></script>


</head>

<style>
    dt {
        font-weight: bold;
    }

    .hero-body {
        background-image: url('/img/lillgarn4.png');
        background-repeat: no-repeat;
        background-size: cover;
    }
</style>

<body class="has-navbar-fixed-top">
    <div class="hero is-medium">
        <div class="hero-head">
            <nav id="common-staff-navbar" class="navbar is-fixed-top" role="navigation" aria-label="main navigation"
                style="background-color: white;">
            </nav>
        </div>

        <div class="hero-body">
            <div class="container notification has-text-centered is-staff" style="max-width: 250px;">
                <p class="title">Home</p>
                <p class="subtitle">Anna Bookning</p>
            </div>

            <div class="container has-text-centered" style="max-width: 1000px;">
                <div class="grid">
                    <button class="button cell is-medium is-bav" onclick="location.href='./groups';">
                        <span class="iconify" data-icon="mdi-tent"></span>&nbsp;Groups
                    </button>
                    <button class="button cell is-medium is-spar" onclick="location.href='./bookings';">
                        <span class="iconify" data-icon="mdi-calendar-month-outline"></span>&nbsp;Bookings
                    </button>
                    <button class="button cell is-medium is-upp" onclick="location.href='./activities';">
                        <span class="iconify" data-icon="mdi-run"></span>&nbsp;Activities
                    </button>
                    <button class="button cell is-medium is-aven" onclick="location.href='./users';">
                        <span class="iconify" data-icon="mdi-account"></span>&nbsp;Users
                    </button>
                    <button class="button cell is-medium is-utm" onclick="location.href='./docs';">
                        <span class="iconify" data-icon="mdi-book-open-blank-variant-outline"></span>&nbsp;Docs
                    </button>
                    <button class="button cell is-medium is-rov" onclick="api.logout()">
                        <span class="iconify" data-icon="mdi-logout"></span>&nbsp;Log out
                    </button>
                </div>
            </div>
        </div>
    </div>



    <div class="section">
        <div class="columns">

            <div class="column is-two-thirds">
                <article class="message">
                    <div class="message-header">
                        <p>Daily message</p>
                        <button class="button">
                            <span class="iconify" data-icon="mdi-pencil"></span>&nbsp;Edit message
                        </button>
                    </div>
                    <div class="message-body">
                        <textarea class="textarea" readonly></textarea>
                    </div>
                </article>
            </div>

            <div class="column is-one-third">
                <article class="message">
                    <div class="message-header">
                        <p>On island today</p>
                    </div>
                    <div class="message-body">
                        <dl>
                            <dt>Arriving:</dt>
                            <div id="arrivingField">
                                <dd>-</dd>
                            </div>

                            <dt>Staying:</dt>
                            <div id="stayingField">
                                <dd>-</dd>
                            </div>

                            <dt>Leaving:</dt>
                            <div id="leavingField">
                                <dd>-</dd>
                            </div>
                        </dl>
                    </div>
                </article>
            </div>
        </div>
    </div>

    <footer class="footer" id="common-footer"></footer>

</body>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        initHTML();
        init();
    });

    let groupsOnIsland;

    async function init() {
        groupsOnIsland = await api.getGroupsOnIsland();

        renderOnIslandTable(groupsOnIsland);
    }

    function renderOnIslandTable(groups) {
        arrivingField = document.getElementById("arrivingField");
        stayingField = document.getElementById("stayingField");
        leavingField = document.getElementById("leavingField");

        if (groups.arriving.length > 0) {
            arrivingField.innerHTML = "";
            groups.arriving.forEach(group => {
                arrivingField.innerHTML += renderGroupLink(group);
            });
        }

        if (groups.staying.length > 0) {
            stayingField.innerHTML = "";
            groups.staying.forEach(group => {
                stayingField.innerHTML += renderGroupLink(group);
            });
        }

        if (groups.leaving.length > 0) {
            leavingField.innerHTML = "";
            groups.leaving.forEach(group => {
                leavingField.innerHTML += renderGroupLink(group);
            });
        }
    }

    function renderGroupLink(group) {
        return `<dd><a href="./groups/view.html?group_id=${group.group_id}">${group.booking_number}&nbsp;${group.name}</a></dd>`;
    }
</script>
